services:
  mysql-hanoi:
    image: mysql:8
    container_name: mysql-hanoi
    restart: always

    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bank_hanoi
      MYSQL_ROOT_HOST: "%"

    ports:
      - "3307:3306"

    volumes:
      - ./docker/init-hanoi.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/replication/master-hn.cnf:/etc/mysql/conf.d/replication.cnf
      - mysql-hanoi-data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - bank-network
  mysql-hanoi-slave:
    image: mysql:8
    container_name: mysql-hanoi-slave
    restart: always

    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bank_hanoi
      MYSQL_ROOT_HOST: "%"

    ports:
      - "3317:3306"

    volumes:
      - ./docker/replication/slave-hn.cnf:/etc/mysql/conf.d/replication.cnf
      - mysql-hanoi-slave-data:/var/lib/mysql

    depends_on:
      mysql-hanoi:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - bank-network
